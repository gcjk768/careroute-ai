# [MLOps] Grafana dashboard provisioning — loads the CareRoute triage dashboard
# JSON from /var/lib/grafana/dashboards on boot.
apiVersion: 1

providers:
  - name: CareRoute
    orgId: 1
    folder: CareRoute
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
