# [AI-Security] AI for cyber defence (AIC Day 3): an AI-drafted security brief
# from the scanners' own reports — NIST CSF Detect (DE.AE-02) -> Respond
# (RS.AN-03). The LLM prioritises and explains; its draft is validated against
