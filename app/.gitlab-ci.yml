# ─────────────────────────────────────────────────────────────────────────────
# CareRoute AI — MLSecOps / LLMSecOps CI/CD pipeline
#
# Demonstrates the "Integrating & Deploying AI Solutions" course aspect: a
# staged pipeline that builds, tests, runs AI-specific security scans (LLM
# red-teaming), scans code/deps/containers, and gates deployment. Mirrors the
# GitLab CI/CD + Terraform stack named in the CareRoute proposal (§2.5, §2.6.5).
#
# All scanners below are FREE / open-source. Stages run left→right.
#
# Per-stage documentation lives in docs/MLOPS.md and docs/vault/MLOps Pipeline.md;
# the gate-by-gate mapping to the DOAIS courseware is in docs/vault/Courseware
# Alignment.md. [MLOps] tags below mark the jobs that make this an ML-Operations
# (not just software) pipeline.
# ─────────────────────────────────────────────────────────────────────────────
stages:
  - lint            # static style/type checks
  - train           # [MLOps] BUILD + release-gate the severity model artifact (+ version the dataset)
  - test            # unit + end-to-end behaviour tests (+ hard model-quality gate + data-lineage gate)
  - monitor         # [MLOps] Pillar 3 — Evidently data-drift + model-performance report
  - ai-security     # LLM red-team scanning (Promptfoo / Garak / DeepTeam / PyRIT) + guardrail regression
  - security-scan   # SAST, SCA, secret, container, IaC & SBOM/AI-BOM scanning
  - report          # [MLOps] executive PDF report — runs AFTER security-scan so it can
                    # summarize the scanners' actual findings (gitleaks/semgrep/bandit/trivy)
  - build           # container images
  - deploy          # infrastructure + shadow/canary deploy (manual gate)
  - post-deploy     # DAST against the DEPLOYED/staging app (needs a live target)

# ── GITLAB NATIVE SCANNERS (free tier) ───────────────────────────────────────
# GitLab ships its own SAST and Secret-Detection analyzers as CI templates, and
# BOTH run on the FREE tier — it is the Security Dashboard and the MR security
# widget that need Ultimate, not the jobs themselves. The analyzers execute and
# their gl-*-report.json artifacts are produced, which is all we need: findings
# are surfaced through our own PDF report (backend/app/ml/report.py parses both).
#
# These are additional independent engines, not replacements for the Semgrep /
# Bandit / gitleaks jobs below — GitLab picks its own analyzer set per language.
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# The templates default these into the `test` stage; move them next to the other
# scanners so the pipeline graph groups all security work in one place.
sast:
  stage: security-scan
secret_detection:
  stage: security-scan

# De-duplicate pipelines: when a branch has an open MR, run ONLY the MR pipeline
# (not a second branch pipeline for the same commit). Scheduled (CT retrain) and
# trigger-API (drift->retrain) pipelines always run.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    # DEPLOY-ONLY BRANCH. `git push origin main:release/deploy` runs lint, train,
    # the tests and the build/deploy path, and skips the ~40 scanner jobs
    # (their rules check CAREROUTE_DEPLOY_ONLY; GitLab's own SAST and secret-
    # detection templates honour *_DISABLED). The two secret-leak gates on
    # build:images still run. Scans keep running on every main pipeline.
    # PYRIT-ONLY BRANCH. `git push origin main:security/pyrit` runs just
    # ai-security:pyrit (~3 min) to check the guardrail without the ~70-job
    # pipeline; every other job's rules skip on CAREROUTE_PYRIT_ONLY.
    - if: '$CI_COMMIT_BRANCH == "security/pyrit"'
      variables:
        CAREROUTE_PYRIT_ONLY: "true"
        SAST_DISABLED: "true"
        SECRET_DETECTION_DISABLED: "true"
    # RUN NAMED JOBS ONLY. `git push origin HEAD:only/train.model,dast.zap-api`
    # runs just those jobs (`.` stands for `:`, which git forbids in branch
    # names; list a job's `needs` too). Every other job's rules skip it. A
    # branch name, not a pipeline variable: this project allows no user-set
    # pipeline variables (ci_pipeline_variables_minimum_override_role).
    - if: '$CI_COMMIT_BRANCH =~ /^only\//'
      variables:
        SAST_DISABLED: "true"
        SECRET_DETECTION_DISABLED: "true"
    - if: '$CI_COMMIT_BRANCH == "release/deploy"'
      variables:
        CAREROUTE_DEPLOY_ONLY: "true"
        SAST_DISABLED: "true"
        SECRET_DETECTION_DISABLED: "true"
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # [Microservices] Every backend image, one per Dockerfile target. The frontend
  # and the legacy `backend` monolith are added explicitly where they apply --
  # neither is a --target in this list. Keep in sync with backend/Dockerfile.
  CAREROUTE_IMAGES: "intake-gateway classifier-agent safety-agent routing-agent reflection-agent hitl-agent handoff-agent llm-gateway rag-service ml-jobs"
  # Which of those are PUBLISHED to ECR. Everything above is built and scanned on
  # every pipeline — that is what proves the microservice split holds — but the
  # DEPLOYED shape is one compute running the `monolith` image, so only what ECS
  # actually pulls is pushed:
  #   backend   the Dockerfile's default `monolith` target (every agent
  #             in-process); also the image the scheduled drift-monitor task runs,
  #             with a different command
  #   frontend  the Next.js server
  # The ten per-agent images are ~1.1 GB each and ECR bills storage per retained
  # tag, so publishing images nothing pulls would spend the demo's runway on
  # registry storage. Add a service here the day its container is in the task
  # definition, and create the matching repo in careroute_ai_infra
  # (modules/careroute_stack, module "ecr" repositories) in the SAME change: ECR
  # repos are not auto-created, so a push to a missing repo fails the job.
  CAREROUTE_PUSH_IMAGES: "backend frontend"

# [MLOps] Cache pip downloads across pipelines, keyed on the dependency manifests
# so the cache is reused until the requirements change (PIP_CACHE_DIR above is the
# directory that gets cached). Applied to every job via `default:` — non-Python
# jobs simply never populate it, so it is a no-op for them.
# NOTE: GitLab caps `cache:key:files` at TWO files, so requirements-mlops.txt
# cannot be part of the key — when only the mlops extras change, the monitor job
# just re-downloads them into the same cache (correctness is unaffected; pip
# always resolves from the manifests, the cache is only a download accelerator).
# `interruptible` lets a newer pipeline on the same ref cancel superseded runs.
default:
  interruptible: true
  cache:
    key:
      files:
        - backend/requirements.txt
        - backend/requirements-dev.txt
    paths:
      - .cache/pip

# ── LINT ─────────────────────────────────────────────────────────────────────
# BLOCKING: ruff is fast and the backend is expected to be clean — a lint gate
# that can never fail is decoration, not a gate.
#
# The version is PINNED, and the rule set is declared in backend/ruff.toml.
# Both matter: an unpinned `pip install ruff` picks up whatever rules the latest
# release enables by default, so the gate would go red on someone else's release
# schedule with no change to this repository. Upgrading ruff is now a deliberate
# edit here, reviewed with whatever new findings it brings.
lint:backend:
  stage: lint
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]lint[:.]backend(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  script:
    - pip install ruff==0.16.3
    - ruff check backend/app

# Advisory (allow_failure) but no longer silenced: an eslint finding now shows
# as a real warning on the pipeline instead of an unconditional green. Uses the
# project's own `next lint` script (Next.js App Router lints app/components/lib —
# there is no `src/` dir, which is why the old `eslint src` invocation errored).
lint:frontend:
  stage: lint
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]lint[:.]frontend(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: node:20-alpine
  script:
    - cd frontend && npm ci && npm run lint && node --test tests/*.test.mjs
  allow_failure: true

# ── TRAIN ────────────────────────────────────────────────────────────────────
# [MLOps] The train/serve SPLIT: this job is the ONE place a model artifact is
# built. `python -m app.ml.train` builds the model end-to-end, enforces the
# release gate (accuracy >= 0.75 AND red-flag recall >= 0.95 — the SAME floors
# as test:model-gate, so a model that would fail CI is never persisted or
# registered in the first place) — exiting NON-ZERO
# and failing the pipeline on a gate breach — persists a versioned, content-
# addressed joblib + a sidecar SHA-256 (tamper-evidence), and MLflow-registers
# `CareRouteTriageRF` when MLflow is present. Downstream test/build jobs consume
# the joblib via `needs:` so the container ships a VALIDATED artifact that
# get_model() loads at boot instead of retraining on every process start.
# [MLOps] Pillar 1 (experiment tracking + Model Registry) & Pillar 4 (Continuous
# Training). `python -m app.ml.train` logs params/metrics and REGISTERS the model
# as `CareRouteTriageRF` to whatever MLFLOW_TRACKING_URI points at. To send runs to
# GitLab's built-in, MLflow-compatible Model Registry, set these two CI/CD variables
# (Settings -> CI/CD -> Variables), no code change needed:
#     MLFLOW_TRACKING_URI    = ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/ml/mlflow
#     MLFLOW_TRACKING_TOKEN  = <a project/personal access token with api scope>
# Unset -> mlflow logs to a local ./mlruns store (browse with `mlflow ui`).
#
# CONTINUOUS TRAINING: the `rules:` below also fire this job on a *scheduled*
# pipeline (Settings -> CI/CD -> Pipeline schedules -> e.g. weekly), so the model
# is periodically retrained + re-gated + re-registered on the latest code/data —
# the scheduled-retraining trigger the course names.
train:model:
  stage: train
  image: python:3.12-slim
  variables:
    CAREROUTE_MODEL_DIR: "$CI_PROJECT_DIR/backend/models"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]train[:.]model(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'          # [CT] scheduled retrain
    - if: '$CI_COMMIT_BRANCH'                           # every push
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - cd backend
    - pip install -r requirements.txt -r requirements-dev.txt mlflow==3.16.1
    - python -m app.ml.train                       # builds + release-gates + persists + MLflow-registers
    # Emit the model audit (accuracy / red-flag recall / fairness / drift /
    # calibration / integrity hashes) as a machine-readable release record.
    - >
      python -c "import json; from app.ml.model import get_model;
      open('models/model_audit.json','w').write(json.dumps(get_model().fairness(), indent=2))"
  artifacts:
    name: "careroute-model-$CI_COMMIT_SHORT_SHA"
    paths:
      - backend/models/*.joblib
      - backend/models/*.sha256
      - backend/models/model_audit.json
      # The run's MLflow tracking store. The deployed MLflow server has no auth
      # and stays internal-only, so CI cannot log to it; without these paths every
      # run, metric and registered version vanished with the job. Download and
      # `mlflow ui --backend-store-uri sqlite:///mlflow.db` to browse this run.
      - backend/mlflow.db
      - backend/mlruns/
    expire_in: 30 days
    when: on_success

# [MLOps] Pillar 2 — DATA VERSIONING. Materialize the deterministic training
# dataset to a snapshot + a content-addressed metadata record (dataSha256). In a
# real setup `dvc add backend/data/triage_dataset.npz` versions the binary and the
# committed .dvc pointer ties a commit to an exact dataset. Here the CI job proves
# reproducibility and hands the metadata to the data-lineage gate below.
#
# --check RUNS FIRST, AND THAT ORDER IS THE WHOLE GATE. This job used to go
# straight to write mode, which OVERWRITES backend/data/triage_dataset.meta.json
# with whatever the current code produces. Every downstream check then compared
# that freshly regenerated file against a model trained from the same code in the
# same pipeline — the dataset was being compared to itself, and a change to
# data.py or features.py that silently altered the training data would sail
# through as "lineage verified". `--check` (export_dataset.check_snapshot) is the
# real assertion: re-derive the dataset and diff its dataSha256 against the
# COMMITTED meta.json, exiting 1 on a mismatch. Only then re-export.
# DVC REMOTES. Two are configured in .dvc/config:
#   * `s3` (DEFAULT since 2026-09-22): s3://careroute-demo-artifacts-<acct>/dvc,
#     the artifacts bucket the infra repo provisions (enable_artifacts_bucket).
#     On `main` this job assumes the same OIDC role deploy:push-images uses
#     (AWS_DEPLOY_ROLE_ARN; its trust policy admits main only) and DVC's boto
#     credential chain picks the web-identity token up from the environment.
#     The role may touch the dvc/ prefix and nothing else in the bucket.
#   * `gitlab`: the generic package registry of THIS project (added 2026-09-15).
#     Used on every other branch, where the AWS role cannot be assumed, via the
#     job token in a --local override that never touches the committed config.
#     Locally a developer uses a personal access token in .dvc/config.local, or
#     their own AWS credentials for the S3 remote.
# `dvc pull` restores the committed snapshot BEFORE the reproducibility check so
# the check compares the regenerated data against the file the pointer actually
# names, and `dvc push` publishes a changed snapshot so the next clone can pull it.
data:version:
  stage: train
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]data[:.]version(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  id_tokens:
    AWS_ID_TOKEN:
      aud: https://gitlab.com
  variables:
    CAREROUTE_DATA_DIR: "$CI_PROJECT_DIR/backend/data"
  script:
    - pip install -q "dvc[s3]==3.67.1"     # same pin as backend/requirements-mlops.txt
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] && [ -n "${AWS_DEPLOY_ROLE_ARN:-}" ]; then
        printf '%s' "$AWS_ID_TOKEN" > /tmp/aws-web-identity-token
        export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws-web-identity-token
        export AWS_ROLE_ARN="$AWS_DEPLOY_ROLE_ARN" AWS_ROLE_SESSION_NAME="gitlab-dvc-${CI_JOB_ID}"
        export DVC_REMOTE=s3
        echo "DVC remote: s3 (OIDC role on main)"
      else
        dvc remote modify --local gitlab custom_auth_header JOB-TOKEN
        dvc remote modify --local gitlab password "$CI_JOB_TOKEN"
        export DVC_REMOTE=gitlab
        echo "DVC remote: gitlab package registry (branch ${CI_COMMIT_BRANCH:-?} cannot assume the AWS role)"
      fi
    # Keep the COMMITTED pointer: `dvc commit -f` below rewrites it in the workspace.
    - cp backend/data/triage_dataset.npz.dvc /tmp/triage_dataset.npz.dvc.committed
    # Best-effort: a snapshot missing from the remote is repaired by the push below,
    # and a STALE pointer (the real failure mode) is caught by the pointer check.
    - 'dvc pull -r "$DVC_REMOTE" -v || echo "dvc pull: snapshot named by the committed pointer is not in the remote (repaired by the push below if the pointer is current)"'
    - cd backend
    - pip install -r requirements.txt
    # Keep a copy of the COMMITTED pointer BEFORE the export overwrites it, and
    # pass it downstream as its own artifact. (Deliberately a plain `cp` rather
    # than `git show HEAD:...`: with the docker executor the clone is performed
    # by the runner HELPER image, so git is not guaranteed to exist inside
    # python:3.12-slim. The checkout is pristine, so this file IS the commit.)
    - cp data/triage_dataset.meta.json data/triage_dataset.meta.committed.json
    # Fails the pipeline if the code no longer reproduces the COMMITTED snapshot.
    - python -m app.ml.export_dataset --check
    - python -m app.ml.export_dataset             # writes triage_dataset.{npz,meta.json}
    # Publish the snapshot to the remote (no-op when unchanged). The export
    # writes the .npz into the workspace only; `dvc push` uploads from DVC's
    # CACHE, so without this commit it reported "Everything is up to date" and
    # uploaded nothing. NOTE --check proves the CONTENT (dataSha256) is unchanged,
    # not the .npz file's md5: the md5 of a compressed .npz also depends on the
    # platform's zlib. The pointer committed in 5cb20cb was taken off-CI, named a
    # snapshot this job never produces, and so every `dvc pull` failed on it.
    - cd "$CI_PROJECT_DIR" && dvc commit -f backend/data/triage_dataset.npz.dvc
    - dvc push -r "$DVC_REMOTE" -v
    # POINTER GATE (after the push, so the object exists either way). The committed
    # .dvc pointer must name exactly the file this job just versioned; otherwise a
    # clone cannot `dvc pull` the dataset its model was trained on. The md5 is only
    # stable inside this image (python:3.12-slim + numpy pin), so a pointer must be
    # taken from this job, not from a developer machine.
    - |
      python - <<'PY'
      import sys
      committed = open("/tmp/triage_dataset.npz.dvc.committed").read()
      current = open("backend/data/triage_dataset.npz.dvc").read()
      if committed != current:
          print("DVC pointer gate: FAILED - backend/data/triage_dataset.npz.dvc is stale.")
          print("The snapshot is pushed; commit this pointer to make it pullable:\n")
          print(current)
          sys.exit(1)
      print("DVC pointer gate: PASSED - committed pointer names the versioned snapshot")
      PY
  artifacts:
    paths:
      - backend/data/triage_dataset.meta.json
      - backend/data/triage_dataset.meta.committed.json
      - backend/data/triage_dataset.npz
    expire_in: 1 week

# [MLOps] Pillar 2 — DURABLE ARTIFACT STORE. CI job artifacts are ephemeral
# (expire_in), so push the released model + its audit to GitLab's Package Registry
# (free, permanent, versioned by the content-addressed model version) for audit &
# rollback. Complements the MLflow registry copy from train:model. Runs on main.
publish:model:
  stage: train
  image: curlimages/curl:latest
  needs: ["train:model"]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]publish[:.]model(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    # Package path is keyed on the commit SHA; the joblib FILENAME already carries
    # the content-addressed model version (careroute-triage-rf-<versionId>.joblib),
    # so both the release commit and the model identity remain traceable.
    - |
      BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/careroute-model/${CI_COMMIT_SHORT_SHA}"
      for f in backend/models/*.joblib backend/models/*.sha256 backend/models/model_audit.json; do
        echo "publishing $f -> $BASE/$(basename "$f")"
        curl --fail --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "$BASE/$(basename "$f")" || echo "upload skipped for $f"
      done
  allow_failure: true

# ── TEST ─────────────────────────────────────────────────────────────────────
# Unit tests + COVERAGE: the regex surfaces total coverage in the MR widget /
# job page; --cov-fail-under makes a coverage regression fail the job. The floor
# is 80% — the widely-used industry baseline — now that the ML entrypoints
# (train/monitor/report/validate_data/export_dataset) have dedicated tests
# (test_ml_entrypoints.py, test_report.py, test_fairness.py). Measured ~81%.
#
# The two ML-attack modules are EXCLUDED here and run in their own job
# (ai-security:ml-attacks, against the train:model artifact). They retrain the
# full model six times (label-flip poisoning at three doses, a clean control, a
# membership-inference victim) - that is the point of them, but one training
# run costs ~5 min on a shared runner since the 22 -> 51 category widening, and
# with them inside this job it ran past the 1 h job timeout (#2870327745,
# 22 Sep: still running at 46 min while build:images sat blocked behind it),
# where before the widening it took 23 min. Every other test still runs here.
test:backend:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]test[:.]backend(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  # Headroom over the project's 1 h default: even without the attack modules
  # this job still trains the model once (test_ml_entrypoints::test_train_main),
  # runs the ART evasion attack (test_robustness) and the eval suites, and the
  # widened model made each of those several times slower. A red job at 60 min
  # said nothing about the code; the tests behind it were passing.
  timeout: 90m
  script:
    - cd backend
    - pip install -r requirements.txt -r requirements-dev.txt
    - |
      pytest -q --junitxml=report.xml --cov=app --cov-report=term --cov-fail-under=80 \
        --ignore=tests/test_ml_attacks.py --ignore=tests/test_adversarial_training.py
  coverage: '/TOTAL.*?(\d+)%/'
  artifacts:
    reports:
      junit: backend/report.xml
    when: always

test:pipeline:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]test[:.]pipeline(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  script:
    - cd backend
    - pip install -r requirements.txt -r requirements-dev.txt
    - pytest -v tests/test_pipeline.py --junitxml=pipeline-report.xml
  artifacts:
    reports:
      junit: backend/pipeline-report.xml
    paths: [backend/pipeline-report.xml]
    when: always

# [Safety NLP][Phase 6] Explicit selection prevents Safety regressions from
# disappearing behind filename or marker changes in the general backend job.
test:safety:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]test[:.]safety(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  script:
    - cd backend
    - pip install -r requirements.txt -r requirements-dev.txt
    - pytest -m safety -q --junitxml=safety-report.xml
  artifacts:
    reports:
      junit: backend/safety-report.xml
    paths: [backend/safety-report.xml]
    when: always

# Aggregate-only benchmark and release-gate checks. No prompts, responses,
# evidence spans or patient text are published as CI artifacts.
test:safety-nlp-benchmark:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]test[:.]safety\-nlp\-benchmark(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  script:
    - cd backend
    - pip install -r requirements.txt -r requirements-dev.txt
    - >
      pytest tests/test_safety_nlp_benchmark.py
      tests/test_safety_nlp_category_benchmark.py
      tests/test_safety_nlp_artifacts.py
      tests/test_safety_nlp_release_gate.py
      -q --junitxml=safety-nlp-benchmark-report.xml
  artifacts:
    reports:
      junit: backend/safety-nlp-benchmark-report.xml
    paths: [backend/safety-nlp-benchmark-report.xml]
    when: always

# [MLOps] HARD MODEL-QUALITY GATE. Unlike the LLM red-team jobs below (which are
# allow_failure), this job MUST pass: it is NOT allow_failure, runs in the `test`
# stage (which precedes build/deploy), and consumes the artifact from train:model
# via `needs:`, so a model that regresses below the release thresholds
# (accuracy >= 0.75 AND safety-critical red-flag recall >= 0.95) BLOCKS the whole
# build/deploy pipeline. This is the release gate on the DEPLOYED artifact.
#
# THE ARTIFACT IS THE POINT. `needs: ["train:model"]` + CAREROUTE_MODEL_DIR are
# what put a persisted joblib where get_model() will find it, and the test file
# now ASSERTS it loaded one (TriageModel.loaded_from_artifact). Without that
# assertion the gate was self-fulfilling: TriageModel.__init__ silently trains a
# fresh model when nothing loads, so "the release gate on the deployed artifact"
# would pass green having graded a model it built itself, seconds earlier, from
# the same code — proving nothing about what the pipeline was about to ship.
# Do NOT set CAREROUTE_ALLOW_FRESH_MODEL_IN_GATE here: in CI a missing artifact
# means this `needs:` did not deliver, which is a failure, not a skip.
test:model-gate:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]test[:.]model\-gate(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  needs: ["train:model"]
  variables:
    CAREROUTE_MODEL_DIR: "$CI_PROJECT_DIR/backend/models"
  script:
    - cd backend
    - pip install -r requirements.txt -r requirements-dev.txt
    # [MLOps] TRAIN/SERVE SKEW, checked against the artifact this pipeline just
    # built and is about to ship — not against whatever a developer has on disk.
    # Blocking, and deliberately BEFORE the quality gate: grading the accuracy of
    # a model that is being fed features it was never trained on measures nothing.
    # See backend/app/ml/feature_contract.py.
    - |
      python -m app.ml.feature_contract --check
    - pytest tests/test_model_gate.py tests/test_feature_contract.py -q --junitxml=model-gate-report.xml
  artifacts:
    reports:
      junit: backend/model-gate-report.xml
    when: always
  # NOT allow_failure — this gate blocks build & deploy on a quality regression.

# [MLOps] Pillar 2 — DATA-LINEAGE GATE. Asserts the COMMITTED dataset's content
# hash (dataSha256) EQUALS the hash the trained model recorded in
# model_audit.json. This proves the released model was trained on exactly the
# versioned data — catching silent data/feature drift between the dataset and the
# model. Consumes both upstream artifacts via `needs:`. A real gate (not
# allow_failure): a lineage mismatch blocks build/deploy.
#
# THE REFERENCE IS THE COMMITTED POINTER, NOT THE REGENERATED FILE. data:version
# rewrites backend/data/triage_dataset.meta.json in this same pipeline and
# passes it here as an artifact, so reading that file compared the regenerated
# dataset against a model trained from the same code moments earlier — a
# tautology that passes by construction. `triage_dataset.meta.committed.json` is
# data:version's pre-export copy: the only version that predates this pipeline
# and can therefore disagree with it. (data:version's `--check` step catches the
# same class of problem earlier; this is the second half of that guarantee, on
# the model side.)
test:data-lineage:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]test[:.]data\-lineage(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  needs: ["train:model", "data:version"]
  variables:
    CAREROUTE_DATA_DIR: "$CI_PROJECT_DIR/backend/data"
  script:
    - cd backend
    - pip install -r requirements.txt
    - |
      python - <<'PY'
      import json
      committed = json.load(open("data/triage_dataset.meta.committed.json"))["dataSha256"]
      regenerated = json.load(open("data/triage_dataset.meta.json"))["dataSha256"]
      md = json.load(open("models/model_audit.json"))["integrity"]["dataSha256"]
      print("committed   dataSha256 :", committed[:24])
      print("regenerated dataSha256 :", regenerated[:24])
      print("model       dataSha256 :", md[:24])
      assert committed == regenerated, (
          "DATASET DRIFT: the code no longer reproduces the COMMITTED snapshot. "
          "Re-run `python -m app.ml.export_dataset` and commit the new meta.json "
          "(and `dvc add` the .npz) as a deliberate, reviewed dataset version."
      )
      assert committed == md, (
          "DATA-LINEAGE MISMATCH: committed dataset != model's training data"
      )
      print("data-lineage gate  : PASSED — model trained on the COMMITTED dataset")
      PY

# [MLOps] DATA-VALIDATION GATE — "validate data BEFORE training on it". Blocking:
# asserts the versioned snapshot's schema (feature space), value domain (no
# NaN/inf, binary encoding), label validity + class support/balance, and
# internal hash consistency. A malformed or degenerate dataset can never
# silently become a released model.
#
# This job DOES check the regenerated snapshot rather than the committed one,
# and that is correct here: the schema/domain/balance assertions need the actual
# arrays, which live in the .npz (git-ignored, DVC-tracked, and not restorable
# in CI without a DVC remote). data:version's `--check` step is what makes that
# safe — the regenerated snapshot is proven byte-identical to the committed
# meta.json's dataSha256 before this job ever sees it.
data:validate:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]data[:.]validate(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  needs: ["data:version"]
  variables:
    CAREROUTE_DATA_DIR: "$CI_PROJECT_DIR/backend/data"
  script:
    - cd backend
    - pip install -r requirements.txt
    - python -m app.ml.validate_data

# [MLOps][Responsible-AI] Offline triage-EVAL benchmark on a gold vignette set:
# acuity accuracy floor, red-flag recall == 1.0 on must-escalate cases, and
# citation-groundedness. Drives the deterministic (no-LLM) pipeline, so it is a
# reproducible release gate on end-to-end triage quality.
test:triage-eval:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]test[:.]triage\-eval(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  needs: ["train:model"]
  variables:
    CAREROUTE_MODEL_DIR: "$CI_PROJECT_DIR/backend/models"
  script:
    - cd backend
    - pip install -r requirements.txt -r requirements-dev.txt
    - pytest tests/test_triage_eval.py -q --junitxml=triage-eval-report.xml
  artifacts:
    reports:
      junit: backend/triage-eval-report.xml
    when: always

# [AI-Security] Adversarial-robustness gate — a real IBM ART (adversarial-
# robustness-toolbox) black-box evasion attack (HopSkipJump) against the deployed
# RandomForest, asserting the model resists SMALL (<= epsilon) input
# perturbations. SKIPS cleanly if `art` is absent (it is a dev-only dependency).
# End-to-end agent-pipeline tests driven through the real UI (Playwright).
#
# IMAGE: mcr.microsoft.com/playwright ships the browsers PREINSTALLED. That is
# required, not convenient — `npx playwright install` downloads from a CDN, and
# on a TLS-intercepting corporate network that fails with
# SELF_SIGNED_CERT_IN_CHAIN. PLAYWRIGHT_CHANNEL=bundled tells the config to use
# those baked-in browsers rather than a system Chrome (which the image has none
# of). Keep the image tag in step with the @playwright/test version in
# frontend/package.json — a mismatch is what makes Playwright try to download.
#
# The suite starts the FRONTEND itself (a production build — see the webServer
# note in playwright.config.js: `next dev`'s proxy cannot carry the red-flag SSE
# stream across its ~30s LLM gap). The BACKEND has to be up first, because
# frontend/lib/api.js silently falls back to an in-browser SIMULATION when it is
# not — which would let this job pass with the agent pipeline switched off. The
# spec's beforeAll hook fails loudly instead, and the wait-loop below makes that
# a clear infrastructure error rather than a confusing test failure.
test:e2e:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]test[:.]e2e(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  needs: ["train:model"]
  variables:
    CAREROUTE_MODEL_DIR: "$CI_PROJECT_DIR/backend/models"
    PLAYWRIGHT_CHANNEL: "bundled"
    BACKEND_URL: "http://127.0.0.1:8000"
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-venv >/dev/null
    - python3 -m venv /tmp/venv
    - . /tmp/venv/bin/activate
    - pip install -q -r backend/requirements.txt
    - (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &)
    # Wait for the backend rather than racing it; fail with a clear message.
    - |
      for i in $(seq 1 60); do
        if curl -sf http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
          echo "backend up after ${i}s"; break
        fi
        if [ "$i" -eq 60 ]; then
          echo "ERROR: backend did not become healthy in 60s; aborting rather than testing the simulation fallback"
          exit 1
        fi
        sleep 1
      done
    - cd frontend && npm ci
    - npx playwright test
  artifacts:
    paths:
      - frontend/playwright-report/
      - frontend/test-results/
    when: always
    expire_in: 1 week
  # BLOCKING since 2026-09-02. It was advisory while three red-flag specs failed
  # for a then-unknown reason. The cause is now measured and fixed: Next's /api
  # rewrite proxies with http-proxy and a 30 s idle `proxyTimeout` that aborts
  # a silent upstream WITHOUT ending the browser response, so any agent quiet
  # for 30 s hung the UI on "Triaging..." forever. app/main.py now emits an
  # SSE keepalive comment every CAREROUTE_SSE_HEARTBEAT_SECONDS (10 s) while
  # the pipeline is silent. With that in place the suite went 6/6 against a
  # production build and the real backend. In this job the LLM providers are
  # absent (no OPENAI_API_KEY), so the agents take their
  # deterministic path and latency is bounded; a red run here is a real
  # regression in the UI, the stream transport, or the agent contract.

# ── AGENT GRAPH LINT + LOOP SAFETY [MLOps][Agentic] ──────────────────────────
# The agent lane's structural gate: every declared worker must actually be
# reached by orchestrate(), and one triage may not exceed its step budget.
# BLOCKING, and cheap — it drives the real pipeline on the deterministic path
# (no LLM provider in CI), so it needs no model, no secret and no network.
#
# A dead node is not a cosmetic problem: a worker that is registered, contract-
# tested and never invoked reports green forever while doing nothing. Unit tests
# cannot see that, because each one calls its agent directly.
test:agent-graph:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]test[:.]agent\-graph(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  needs: []
  script:
    - cd backend
    - pip install -r requirements.txt -r requirements-dev.txt
    - pytest tests/test_agent_graph.py -q --junitxml=agent-graph-report.xml
  artifacts:
    reports:
      junit: backend/agent-graph-report.xml
    when: always

test:robustness:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]test[:.]robustness(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  needs: ["train:model"]
  variables:
    CAREROUTE_MODEL_DIR: "$CI_PROJECT_DIR/backend/models"
  script:
    - cd backend
    - pip install -r requirements.txt -r requirements-dev.txt
    # pytest returns exit code 5 ("no tests collected") when the whole module is
    # skipped at collection — which is exactly what the module-level
    # `importorskip("art")` does when adversarial-robustness-toolbox is absent.
    # Treat that clean skip as success; surface any real failure (exit 1) normally.
    #
    # NOTE: GitLab runs job scripts under `set -e`, so pytest MUST be captured via
    # `|| code=$?` — a bare `pytest ...; code=$?` would trip errexit on the exit-5
    # and abort the script before the guard ever runs.
    - |
      code=0
      pytest tests/test_robustness.py -q --junitxml=robustness-report.xml || code=$?
      if [ "$code" -eq 5 ]; then
        echo "No robustness tests collected (adversarial-robustness-toolbox not installed) - skipping cleanly"
        exit 0
      fi
      exit "$code"
  artifacts:
    reports:
      junit: backend/robustness-report.xml
    when: always
  # ART is now PINNED in requirements-dev.txt, so the exit-5 guard above is a
  # safety net rather than the normal path — until 2026-09-12 it was the normal
  # path, and this job was green without ever running the attack.
  #
  # Still advisory for one more cycle: the gate has no CI-hardware baseline yet
  # (HopSkipJump is stochastic and the runner trains its own model), so promote
  # it to blocking once a few pipelines show a stable robust-accuracy margin.
  allow_failure: true

# ── PERFORMANCE + API ROBUSTNESS (test stage) ────────────────────────────────
# Both jobs BOOT THE BACKEND INSIDE THE JOB, using the same recipe test:e2e
# proves works: no LLM provider is configured in CI, so the agents take their
# deterministic path and the app is healthy without any secret. That matters
# because it is what makes these produce evidence on EVERY pipeline instead of
# waiting on a deployed target that does not exist yet (the mistake that left
# dast:owasp-zap dormant — see its comment).

# LOAD TEST — Locust. Chosen over k6 because every other Python job here already
# uses python:3.12-slim and the shared pip cache, so this adds no new toolchain.
# The SLO check and its thresholds live in the locustfile, not here, so the same
# gate runs identically on a developer's laptop.
#
# ADVISORY (`allow_failure: true`) for now: there is no measured baseline on CI
# hardware yet, and a latency gate tuned from zero data is a flaky gate, not a
# gate. The locustfile already sets a correct non-zero exit code on breach, so
# promoting this to blocking is deleting the `allow_failure` line below — the
# same way test:e2e was promoted on 2026-09-02 once its failure was understood.
test:load-locust:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]test[:.]load\-locust(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  needs: ["train:model"]
  variables:
    CAREROUTE_MODEL_DIR: "$CI_PROJECT_DIR/backend/models"
    CAREROUTE_LOAD_SUMMARY: "$CI_PROJECT_DIR/locust-summary.json"
    LOAD_USERS: "20"
    LOAD_SPAWN_RATE: "5"
    LOAD_DURATION: "60s"
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl >/dev/null
    - pip install -q -r backend/requirements.txt locust
    - (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &)
    - |
      for i in $(seq 1 60); do
        if curl -sf http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
          echo "backend up after ${i}s"; break
        fi
        if [ "$i" -eq 60 ]; then
          echo "ERROR: backend did not become healthy in 60s; aborting rather than load-testing nothing"
          exit 1
        fi
        sleep 1
      done
    - locust -f backend/tests/load/locustfile.py --headless
        -u "$LOAD_USERS" -r "$LOAD_SPAWN_RATE" -t "$LOAD_DURATION"
        --host http://127.0.0.1:8000
        --csv locust --csv-full-history --only-summary
  artifacts:
    paths:
      - locust-summary.json
      - locust_stats.csv
      - locust_failures.csv
      - locust_stats_history.csv
    when: always
    expire_in: 1 month
  allow_failure: true

# API FUZZING — Schemathesis generates property-based test cases straight from
# the OpenAPI schema FastAPI publishes at /openapi.json, then asserts the server
# never 500s and never violates its own declared schema. This is the fuzzing
# complement to ZAP: ZAP attacks with a fixed payload catalogue, Schemathesis
# derives inputs from OUR contract, so it explores the parameter space that is
# specific to this API.
#
# The SSE triage endpoint is excluded: it streams indefinitely by design, so a
# fuzzer treats a healthy long-lived response as a hang.
#
# BLOCKING since the spec declares every status code and content type the
# handlers really return (400/401/404/429, text/plain /metrics, SSE): a new
# undocumented response or a 500 now fails the pipeline instead of scrolling by.
test:api-fuzz-schemathesis:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]test[:.]api\-fuzz\-schemathesis(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  needs: ["train:model"]
  variables:
    CAREROUTE_MODEL_DIR: "$CI_PROJECT_DIR/backend/models"
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl >/dev/null
    - pip install -q -r backend/requirements.txt schemathesis
    - (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &)
    - |
      for i in $(seq 1 60); do
        if curl -sf http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
          echo "backend up after ${i}s"; break
        fi
        if [ "$i" -eq 60 ]; then echo "ERROR: backend did not become healthy in 60s"; exit 1; fi
        sleep 1
      done
    - set -o pipefail
    - st run http://127.0.0.1:8000/openapi.json
        --checks all
        --exclude-path-regex '/api/triage/stream'
        --max-examples "${FUZZ_EXAMPLES:-25}"
        --report junit --report-junit-path schemathesis-junit.xml
        2>&1 | tee schemathesis.txt
  artifacts:
    paths: [schemathesis.txt, schemathesis-junit.xml]
    reports:
      junit: schemathesis-junit.xml
    when: always

# ── MONITOR ──────────────────────────────────────────────────────────────────
# [MLOps] Pillar 3 — MODEL & DATA MONITORING (course: "Monitoring and Logging").
# Generates an Evidently AI report (the drift tool named in the course tool table)
# comparing a REFERENCE distribution vs a shifted "production" sample: data drift
# (PSI/KS), target drift, and classification performance (accuracy/precision/
# recall/F1). Degrades to a built-in PSI+accuracy report if Evidently is absent,
# so the job always publishes something. Reporting job (allow_failure) — the
# shifted sample is EXPECTED to drift. Publishes the HTML dashboard + JSON.
#
# [MLOps][CT] The loop is CLOSED: monitor.py compares the headline drift value
# to CAREROUTE_DRIFT_THRESHOLD and, on a breach, calls the GitLab trigger API
# to fire a retrain pipeline (train:model re-trains, re-gates, re-registers).
# To activate, set ONE CI/CD variable (Settings -> CI/CD -> Variables):
#     CAREROUTE_PIPELINE_TRIGGER_TOKEN = <a Pipeline trigger token>
# A triggered pipeline never re-triggers itself (CI_PIPELINE_SOURCE guard), so
# one breach yields exactly one retrain. Optional knobs:
#     CAREROUTE_DRIFT_THRESHOLD  (default 0.5 driftShare / 0.25 PSI)
#     CAREROUTE_MONITOR_SOURCE=live  — monitor REAL logged traffic instead of
#     the synthetic shift (needs an inference log mounted into the job).
monitor:evidently:
  stage: monitor
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]monitor[:.]evidently(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  needs: ["train:model"]
  variables:
    CAREROUTE_MODEL_DIR: "$CI_PROJECT_DIR/backend/models"
    CAREROUTE_MONITOR_DIR: "$CI_PROJECT_DIR/backend/monitoring"
  script:
    - |
      cd backend
      pip install -r requirements.txt
      pip install -r requirements-mlops.txt || echo "mlops extras unavailable — monitor.py will use its built-in PSI fallback"
      python -m app.ml.monitor
  artifacts:
    paths:
      - backend/monitoring/drift_report.html
      - backend/monitoring/drift_report.json
    when: always
    expire_in: 1 week
  allow_failure: true

# ── REPORT ───────────────────────────────────────────────────────────────────
# [MLOps] Executive PDF report — a management-facing summary (model quality,
# release gates, fairness, calibration, data lineage, drift, pipeline/supply
# chain, and the ACTUAL security-scan findings) rendered to PDF with reportlab.
# Runs after security-scan and `needs:` the scanners' JSON/SARIF artifacts so
# the "Security scan results" section shows real counts; the scan needs are
# `optional` so a pipeline where a scanner didn't run still gets a report.
# This is the "hand to stakeholders" artifact; download it from the job.
report:pdf:
  stage: report
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]report[:.]pdf(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  needs:
    - train:model
    - monitor:evidently
